{{ define "lead_article" }}
{{ $a := .A }}
<article class="group overflow-hidden rounded-xl border border-foam/10 transition-colors hover:border-foam/20">
  <div class="grid grid-cols-1 items-stretch lg:grid-cols-12">
    <div class="flex flex-col justify-between p-6 sm:p-8 lg:col-span-7">
      <div>
        <div class="mb-4 flex items-center gap-2 text-xs text-foam/55">
          <span>{{ $a.Category }}</span>
          <span aria-hidden="true">·</span>
          <span>{{ $a.DateLabel }}</span>
          <span aria-hidden="true">·</span>
          <span>{{ $a.ReadTimeMinutes }} min</span>
        </div>
        <h2 class="font-serif text-2xl font-medium leading-tight tracking-tight text-foam sm:text-3xl">
          <a href="/artigo/{{ $a.Slug }}" class="transition-colors hover:text-foam/80">{{ $a.Title }}</a>
        </h2>
        <p class="mt-4 line-clamp-3 text-sm leading-7 text-foam/60 sm:text-base">{{ $a.LeadParagraph }}</p>
      </div>
      <div class="mt-8 flex items-center justify-between gap-4 border-t border-foam/10 pt-5">
        <a href="/autor/{{ $a.Author.Slug }}" class="flex items-center gap-3">
          <img src="{{ $a.Author.AvatarURL }}" alt="{{ $a.Author.Name }}" loading="lazy" class="h-9 w-9 rounded-full object-cover ring-1 ring-foam/10" />
          <span>
            <span class="block text-[13px] font-medium text-foam">{{ $a.Author.Name }}</span>
            <span class="block text-xs text-foam/55">{{ $a.Author.Role }}</span>
          </span>
        </a>
        <div class="flex items-center gap-2">
          <.form action="/salvos/{{ $a.Slug }}" method="post" class="flex">
            <input type="hidden" name="next" value="{{ .Next }}" />
            <button type="submit" data-saved="{{ if $a.Saved }}true{{ else }}false{{ end }}" class="rounded-lg border p-2 transition-colors {{ if $a.Saved }}border-copper/40 text-copper{{ else }}border-foam/10 text-foam/60 hover:text-foam{{ end }}" aria-label="{{ if $a.Saved }}Remover dos salvos{{ else }}Salvar artigo{{ end }}">
              <svg class="h-4 w-4 {{ if $a.Saved }}fill-current{{ end }}" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
            </button>
          </.form>
          <a href="/artigo/{{ $a.Slug }}" class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-foam px-4 text-[13px] font-medium text-ink transition-colors hover:bg-foam/90">
            <span>Ler ensaio</span>
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" /></svg>
          </a>
        </div>
      </div>
    </div>
    <a href="/artigo/{{ $a.Slug }}" class="relative block min-h-[240px] overflow-hidden border-t border-foam/10 bg-foam/5 lg:col-span-5 lg:min-h-full lg:border-l lg:border-t-0" tabindex="-1" aria-hidden="true">
      <img src="{{ $a.CoverImage }}" alt="" loading="lazy" class="absolute inset-0 h-full w-full object-cover" />
    </a>
  </div>
</article>
{{ end }}
